<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLOps Question Bank — Plain-English Explanations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF1EC;
    --surface:#FFFFFF;
    --ink:#1C2321;
    --muted:#5D685F;
    --border:#DCE2DA;
    --accent:#2F6F5E;
    --accent-soft:#E4EEE9;
    --amber:#B4712B;
    --amber-soft:#F7ECDD;
    --wrong:#B14B4B;
    --wrong-soft:#F8ECEC;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-soft);}

  .app{
    display:grid;
    grid-template-columns:300px 1fr;
    min-height:100vh;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    background:#FBFBF9;
    border-right:1px solid var(--border);
    padding:28px 0 40px;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
  }
  .sidebar-head{
    padding:0 22px 20px;
    border-bottom:1px solid var(--border);
    margin-bottom:10px;
  }
  .sidebar-head .kicker{
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    color:var(--accent);
    letter-spacing:0.03em;
  }
  .sidebar-head h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:21px;
    margin:6px 0 8px;
    line-height:1.25;
  }
  .sidebar-head p{
    margin:0;
    font-size:13.5px;
    color:var(--muted);
  }
  .qlist{
    list-style:none;
    margin:0;
    padding:10px 12px;
  }
  .qlist li{margin-bottom:3px;}
  .qbtn{
    width:100%;
    display:flex;
    align-items:flex-start;
    gap:10px;
    text-align:left;
    background:none;
    border:none;
    border-radius:8px;
    padding:9px 10px;
    cursor:pointer;
    color:var(--ink);
    font-family:'Inter',sans-serif;
  }
  .qbtn:hover{background:var(--accent-soft);}
  .qbtn.active{background:var(--accent);color:#fff;}
  .qbtn .num{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--muted);
    flex-shrink:0;
    padding-top:1px;
    min-width:28px;
  }
  .qbtn.active .num{color:rgba(255,255,255,0.75);}
  .qbtn .meta{display:flex;flex-direction:column;gap:2px;}
  .qbtn .topic{font-size:13.5px;font-weight:500;}
  .qbtn .type{
    font-size:11px;
    color:var(--muted);
    font-family:'JetBrains Mono',monospace;
  }
  .qbtn.active .type{color:rgba(255,255,255,0.7);}

  /* ---------- Main ---------- */
  main{
    padding:48px clamp(24px,5vw,72px) 80px;
    max-width:880px;
  }
  .top-tags{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .tag{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    padding:4px 10px;
    border-radius:99px;
    border:1px solid var(--border);
    color:var(--muted);
  }
  .tag.strong{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
  }
  h2.qtitle{
    font-family:'Space Grotesk',sans-serif;
    font-size:26px;
    line-height:1.3;
    margin:0 0 6px;
  }
  .prompt{
    font-size:16.5px;
    color:var(--ink);
    white-space:pre-line;
    margin:14px 0 26px;
  }
  .prompt code, .yaml{
    font-family:'JetBrains Mono',monospace;
    font-size:13.5px;
    background:#F1F3EF;
    border:1px solid var(--border);
    border-radius:8px;
    display:block;
    padding:14px 16px;
    white-space:pre;
    overflow-x:auto;
    color:#333;
    margin:14px 0;
  }

  .options{
    list-style:none;
    margin:0 0 32px;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    border:1px solid var(--border);
    background:var(--surface);
    border-radius:var(--radius);
    padding:12px 14px;
    display:flex;
    gap:10px;
    align-items:flex-start;
    font-size:15px;
  }
  .opt.correct{
    border-color:var(--accent);
    background:var(--accent-soft);
  }
  .opt .mark{
    flex-shrink:0;
    width:20px;
    height:20px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    margin-top:1px;
    border:1.5px solid var(--border);
    color:transparent;
  }
  .opt.correct .mark{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }

  .panel{
    border-radius:var(--radius);
    padding:20px 22px;
    margin-bottom:20px;
    border:1px solid var(--border);
  }
  .panel h3{
    font-family:'Space Grotesk',sans-serif;
    font-size:15px;
    margin:0 0 10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .panel.simple{
    background:var(--amber-soft);
    border-color:#E6D2AE;
  }
  .panel.simple h3{color:var(--amber);}
  .panel.simple p{margin:0 0 10px;font-size:15px;}
  .panel.simple p:last-child{margin-bottom:0;}

  .panel.why h3{color:var(--muted);}
  .panel.why{background:var(--surface);}
  .why-item{
    display:flex;
    gap:10px;
    padding:9px 0;
    border-top:1px solid var(--border);
    font-size:14.5px;
  }
  .why-item:first-of-type{border-top:none;padding-top:2px;}
  .why-item .dot{
    flex-shrink:0;
    width:8px;
    height:8px;
    border-radius:50%;
    margin-top:6px;
  }
  .why-item.good .dot{background:var(--accent);}
  .why-item.bad .dot{background:var(--wrong);}
  .why-item b{font-weight:600;}

  .marks-line{
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    color:var(--muted);
    margin-bottom:4px;
  }

  .nav{
    display:flex;
    justify-content:space-between;
    margin-top:36px;
    padding-top:20px;
    border-top:1px solid var(--border);
  }
  .nav.nav-top{
    margin-top:0;
    padding-top:0;
    border-top:none;
    margin-bottom:28px;
  }
  .navbtn{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    background:var(--surface);
    border:1px solid var(--border);
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .navbtn:hover{border-color:var(--accent);color:var(--accent);}
  .navbtn:disabled{opacity:0.35;cursor:not-allowed;}
  .navbtn:disabled:hover{border-color:var(--border);color:var(--ink);}
  .navbtn.reveal{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    margin-bottom:28px;
    width:100%;
    justify-content:center;
    padding:13px 16px;
    font-size:14.5px;
  }
  .navbtn.reveal:hover{
    background:#265E4F;
    border-color:#265E4F;
    color:#fff;
  }

  /* mobile */
  .menu-toggle{display:none;}
  @media (max-width: 860px){
    .app{grid-template-columns:1fr;}
    .sidebar{
      position:relative;
      height:auto;
      max-height:none;
      border-right:none;
      border-bottom:1px solid var(--border);
      display:none;
    }
    .sidebar.open{display:block;}
    .menu-toggle{
      display:flex;
      align-items:center;
      gap:8px;
      margin:20px 24px 0;
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:8px;
      padding:10px 14px;
      font-family:'JetBrains Mono',monospace;
      font-size:12.5px;
      color:var(--ink);
      cursor:pointer;
      width:calc(100% - 48px);
    }
    main{padding:20px 22px 60px;}
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="kicker">DEGREE LEVEL · MLOPS</div>
      <h1>Question Bank</h1>
      <p>21 questions from the MLOps exam section, each unpacked in plain English. Pick one to start.</p>
    </div>
    <ul class="qlist" id="qlist"></ul>
  </aside>

  <main>
    <button class="menu-toggle" id="menuToggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰ Browse all 23 questions</button>
    <div id="content"></div>
  </main>
</div>

<script>
const DATA = [
{
  num:164, marks:2, type:"MCQ", topic:"MLOps vs DevOps scope",
  question:"Which of the following steps in the data science lifecycle do not require MLOps to manage but DevOps suffices?",
  options:[
    {t:"Bias detection", c:false},
    {t:"Model training & selection", c:false},
    {t:"Feature engineering", c:true},
    {t:"Champion and challenger model evaluation and promotion", c:false},
    {t:"Label drift detection", c:false},
  ],
  simple:"MLOps exists for the parts of the job that are unique to machine learning — is the model fair, is it still accurate, should we swap in a better one. Feature engineering — cleaning and transforming columns of data into inputs a model can use — is really just a data pipeline job. Regular DevOps practices (version control, automated pipelines, testing) can handle that fine, without any ML-specific tooling.",
  why:[
    {good:false, t:"Bias detection needs ML-aware tooling to check fairness across groups — a DevOps pipeline has no concept of 'fairness'."},
    {good:false, t:"Choosing and training models is the core ML activity MLOps was built to manage."},
    {good:true, t:"Feature engineering is data transformation — the same kind of work DevOps/data-engineering pipelines already handle well."},
    {good:false, t:"Comparing a new 'challenger' model against the current 'champion' before promoting it is an ML-specific governance step."},
    {good:false, t:"Detecting drift in labels over time requires monitoring model-relevant statistics, not just running code."},
  ]
},
{
  num:165, marks:2, type:"MCQ", topic:"ML governance",
  question:"In what way can effective governance of ML systems be realized beyond just accuracy measurement?",
  options:[
    {t:"Monitoring, Observability, Response", c:false},
    {t:"Continuous integration, Continuous Delivery, Operations", c:false},
    {t:"Logging, Tracing, Metrics Collection", c:false},
    {t:"Bias detection, Drift monitoring & Explainability", c:true},
    {t:"Regulatory risk, Reputational harm & Change management.", c:false},
  ],
  simple:"A model can score 95% accuracy on paper and still be a problem in the real world — maybe it treats certain groups unfairly, maybe the world has quietly changed underneath it, or maybe nobody can explain why it made a decision. Governance means checking for exactly those three things: unfair bias, drift away from reality, and the ability to explain the model's reasoning.",
  why:[
    {good:false, t:"Monitoring/Observability/Response describes running infrastructure reliably — useful, but not specific to governing a model's fairness or trustworthiness."},
    {good:false, t:"CI/CD/Operations is about shipping software reliably, not about judging whether a model's decisions are trustworthy."},
    {good:false, t:"Logging/Tracing/Metrics are the raw ingredients for observability, not governance concepts themselves."},
    {good:true, t:"Bias, drift, and explainability are precisely the things accuracy alone doesn't tell you about a model."},
    {good:false, t:"These are real consequences of poor governance, but they're outcomes to avoid, not the mechanisms you put in place."},
  ]
},
{
  num:166, marks:2, type:"MCQ", topic:"Production operations",
  question:"Which of the following captures the 3 pillars of production operations?",
  options:[
    {t:"Monitoring, Observability, Response", c:true},
    {t:"Detect, Understand, Act", c:false},
    {t:"CI, CD, MLSecOps", c:false},
    {t:"Explainability, Drift Monitoring, Bias Detection", c:false},
    {t:"Infrastructure, Software, Configuration", c:false},
  ],
  simple:"Running anything in production is like being on call: you keep an eye on dashboards (Monitoring), you can dig deep to understand why something broke (Observability), and you have a plan to actually fix it (Response). Those three together are the backbone of keeping a live system healthy.",
  why:[
    {good:true, t:"These are the textbook three pillars — watch, understand, act — applied specifically to running systems in production."},
    {good:false, t:"Similar idea in spirit, but it's not the standard named terminology used for this."},
    {good:false, t:"CI/CD is about shipping code changes, and MLSecOps is about security — neither is about day-to-day production operations."},
    {good:false, t:"These are governance concerns (fairness, staleness), not the operational pillars for keeping a system running."},
    {good:false, t:"These describe the layers of a tech stack, not the operational practices applied to it."},
  ]
},
{
  num:167, marks:2, type:"MCQ", topic:"Data sources",
  question:"Which of the below is not an example of a software-driven data source?",
  options:[
    {t:"OLTP database that serves as the backend to a PHP application", c:false},
    {t:"OpenAI-hosted URL endpoint that serves your custom-trained GPT", c:false},
    {t:"Logs from containers", c:false},
    {t:"Docker manifest file", c:true},
    {t:"CML report in a Github repo", c:false},
  ],
  simple:"A 'software-driven data source' is something that produces or holds live data because software is actually running and doing work — a database being written to, an API being called, logs being generated. A Docker manifest file is just a static description of what's inside a container image (which files, which layers). Nothing is 'happening' when you read it — it's paperwork, not a data feed.",
  why:[
    {good:false, t:"A live database backing an app is constantly being read from and written to — a genuine data source."},
    {good:false, t:"An API endpoint being queried produces request/response data continuously — that counts as software-driven."},
    {good:false, t:"Container logs are generated as the software runs — a classic operational data source."},
    {good:true, t:"A manifest file just describes an image; it doesn't get generated by running software the way logs or database rows do."},
    {good:false, t:"A CML report is generated by a pipeline run — it's an output produced by software executing."},
  ]
},
{
  num:168, marks:2, type:"MCQ", topic:"When LLMs are the wrong tool",
  question:"For which of the following use cases is an LLM NOT well suited?",
  options:[
    {t:"Reasoning about macroeconomic implications of a country's finance policy.", c:false},
    {t:"Answering targeted questions about features of a washing machine from its user manual.", c:false},
    {t:"Performing rule-driven classification of scanned images into ID proof / address proof categories.", c:false},
    {t:"Incorporating dynamic learning about customer preferences for customer servicing.", c:false},
    {t:"Building a \"risky driving\" alerting system using telematics data from trucks (location, movement, driving behaviour, vehicle health sensors).", c:true},
  ],
  simple:"LLMs are language specialists — they're good at reading, writing, reasoning over text, and answering questions from documents. Detecting risky driving from raw sensor streams (GPS coordinates, accelerometer readings, engine data) is a numeric time-series pattern-recognition problem. That calls for a model built for sensor data, not a language model.",
  why:[
    {good:false, t:"Reasoning through the implications of a policy is a language-and-reasoning task — right in an LLM's wheelhouse."},
    {good:false, t:"Answering questions from a manual is classic retrieval-augmented question answering — a strong LLM use case."},
    {good:false, t:"Classifying scanned documents by type is text/image-and-language adjacent and LLMs (especially multimodal ones) handle this well."},
    {good:false, t:"Learning and adapting to customer preferences via conversation is a natural fit for LLM-based assistants."},
    {good:true, t:"This is a sensor/time-series problem with no natural language involved — a purpose-built model on telematics data will do far better."},
  ]
},
{
  num:169, marks:2, type:"MCQ", topic:"Feast feature store design",
  question:"The data schema comprises a Fact table (PurchaseEvent) recording purchases via various channels, plus Dimension tables for Customer, Channel, and Product. How would you design the Feast data model to support ML development?",
  options:[
    {t:"Every Dimension table is a Feast entity. The PurchaseEvent Fact table becomes a FeatureView.", c:false},
    {t:"The PurchaseEvent Fact table becomes a Feast entity. Each Dimension table is a FeatureView with the Fact entity linked to it.", c:false},
    {t:"The PurchaseEvent Fact table needs to be processed further to create useful features (e.g. aggregations over purchase events). That processed table becomes a FeatureView. Every Dimension table is a Feast entity linked to that FeatureView.", c:true},
    {t:"Join the Fact and Dimension tables into one large denormalized table, summarize it into features, and make this the FeatureView with no entity specified.", c:false},
  ],
  simple:"In Feast, an 'entity' is a real-world thing you want to know something about — a customer, a channel, a product. A 'FeatureView' is a set of computed features about those entities. Raw purchase transactions aren't features yet — you first need to summarize them (like 'purchases in the last 30 days'). So: crunch the raw purchase events into useful numbers first (that becomes the FeatureView), and connect it to the entities — customer, channel, product — it describes.",
  why:[
    {good:false, t:"This treats the raw, un-aggregated purchase log as a FeatureView, but raw transactions aren't useful model inputs on their own."},
    {good:false, t:"This flips entities and feature views the wrong way round — customers/channels/products are the entities, not the purchase log."},
    {good:true, t:"Aggregating the fact table into real features, then linking every relevant dimension as an entity, is exactly how Feast is meant to be used."},
    {good:false, t:"Denormalizing everything into one giant table throws away the whole point of entities — you lose the ability to reuse features per entity across models."},
  ]
},
{
  num:170, marks:2, type:"MSQ", topic:"Git fundamentals",
  question:"Which of the following statements regarding git are true?",
  options:[
    {t:"\"git checkout -b branch\" will not work if the branch does not exist.", c:false},
    {t:"A pull request is used to merge 2 branches", c:true},
    {t:"On \"git commit\", all collaborators in the repo can see the changes immediately.", c:false},
    {t:"\"git push origin feature/my-cool-idea\" pushes code from the local branch \"feature/my-cool-idea\" to the local branch \"origin\".", c:false},
    {t:"On \"git pull\", all changes in the current branch are downloaded from remote.", c:true},
  ],
  simple:"A pull request is literally a formal request to merge one branch into another, reviewed before it happens. 'git pull' brings down whatever's new on the remote version of your current branch and merges it in. Everything else in this list mixes up local vs remote or misunderstands what a command does.",
  why:[
    {good:false, t:"'-b' actually means create the branch — it's designed to work precisely when the branch doesn't exist yet."},
    {good:true, t:"That's the whole purpose of a pull request: propose and review a merge between two branches."},
    {good:false, t:"A commit only changes your local repository — nobody else sees it until you push it somewhere shared."},
    {good:false, t:"\"origin\" here is just the name of the remote repository, not a branch — the command pushes your local branch to a same-named branch on that remote."},
    {good:true, t:"'git pull' is shorthand for fetch + merge, bringing the remote's version of your current branch down and combining it."},
  ]
},
{
  num:171, marks:2, type:"MSQ", topic:"Scope of MLOps",
  question:"Which of the below are part of what MLOps manages?",
  options:[
    {t:"ML models", c:true},
    {t:"Not the actual LLM itself since that is large and proprietary, only its architecture", c:false},
    {t:"Data engineering code", c:true},
    {t:"Only small data since big data isn't effectively managed via versioning systems", c:false},
    {t:"k8s (Kubernetes) configuration files", c:true},
  ],
  simple:"MLOps is broad — it covers the models themselves, the code that prepares data for them, and the infrastructure config used to serve them. It doesn't shrink away from big proprietary models or big data; with the right tooling (model registries, data versioning tools built for scale), all of it is manageable.",
  why:[
    {good:true, t:"Models are the central artifact MLOps exists to version, deploy, and monitor."},
    {good:false, t:"You still need to track and manage the deployed model artifact itself, not just its architecture — size and ownership don't exempt it."},
    {good:true, t:"The code that builds features and prepares data is squarely inside MLOps's remit."},
    {good:false, t:"Big data absolutely can be versioned and managed (with tools designed for scale) — it's not limited to 'only small data'."},
    {good:true, t:"Infrastructure-as-config files, like k8s manifests, are part of what needs to be tracked and managed for reliable deployment."},
  ]
},
{
  num:172, marks:2, type:"MSQ", topic:"Security attacks on ML systems",
  question:"Which of the below definitions of security attacks on ML systems are correct?",
  options:[
    {t:"Identifying which patient's data has been used in a heart attack prediction model is an example of membership inference attack.", c:true},
    {t:"Cloning a live API and stealing away live traffic is an example of man-in-the-middle attack.", c:false},
    {t:"Fooling a vehicle by making it understand red signals as orange is an example of evasion attack.", c:true},
    {t:"Figuring out which facial patterns are known to cause a positive match in a criminal matching system is an example of inversion attack.", c:true},
    {t:"Feeding wrong data samples is an example of enrichment attack.", c:false},
  ],
  simple:"Three real attack types show up correctly here: figuring out whether someone's data was used to train a model (membership inference), tricking a live model with a doctored input so it misreads it (evasion), and reverse-engineering what patterns the model 'likes' to reveal sensitive information (inversion). The other two options misname their attacks — cloning an API to steal its traffic is closer to theft/impersonation, and feeding it wrong data on purpose is data poisoning, not an 'enrichment attack' (which isn't a standard security term here).",
  why:[
    {good:true, t:"Membership inference is exactly this — determining if a specific record was part of the training data, which can leak private information."},
    {good:false, t:"A man-in-the-middle attack means secretly intercepting communication between two parties — cloning an API to redirect traffic is a different kind of theft/impersonation attack."},
    {good:true, t:"Evasion attacks manipulate an input just enough to fool the model at inference time — a textbook example is making a stop sign read as something else."},
    {good:true, t:"Model inversion reconstructs sensitive input patterns (like facial features) that trigger a certain output — a genuine privacy risk."},
    {good:false, t:"Deliberately feeding bad data to corrupt a model is data poisoning, not an 'enrichment attack' — that label doesn't describe a real recognized attack type."},
  ]
},
{
  num:173, marks:2, type:"MSQ", topic:"Model deployment (Docker & k8s)",
  question:"Which of the following statements regarding model deployment are true?",
  options:[
    {t:"Once a Docker image is created, the Dockerfile is no longer required to deploy the image.", c:true},
    {t:"The Registry allows for having independent development machines where Docker images are created, separate from a common container execution environment like k8s.", c:true},
    {t:"The annotation '@app.post(\"/predict\")' tells FastAPI that this app can receive all HTTP request types for the endpoint \"/predict\".", c:false},
    {t:"A K8s cluster takes time to spin up because containers are heavyweight and take time to deploy on host machines.", c:false},
    {t:"A custom web service using FastAPI is better than a k8s cluster of containers only for fast iterations on development and testing.", c:true},
    {t:"A pod is the smallest unit of deployment in k8s, and comprises of one or more containers.", c:true},
    {t:"The benefits of k8s over using plain Docker are ability to scale and have easier management of containers", c:true},
  ],
  simple:"A Dockerfile is just the recipe — once you've baked the image, you can ship and run that image anywhere without needing the recipe again. A container registry is the shared shelf that lets developers build images on their own machines and hand them off to wherever they're actually run, like a k8s cluster. FastAPI's '@app.post' only listens for POST requests, not every HTTP verb — that's a common misconception. And a plain FastAPI service is genuinely handy for quick dev/testing, but k8s earns its keep in production because it scales and manages many containers for you (and containers are lightweight, not slow to spin up — that's the whole point of using them over VMs).",
  why:[
    {good:true, t:"The Dockerfile's job ends once it produces the image — you deploy and run the resulting image, not the recipe."},
    {good:true, t:"A registry decouples 'where images get built' from 'where images get run', which is exactly why teams use one."},
    {good:false, t:"'@app.post' registers a route only for POST requests — a different decorator (or method) is needed for GET, PUT, etc."},
    {good:false, t:"Containers are lightweight and start quickly by design — that's precisely what makes them faster than VMs, not slower."},

let current = 0;
let revealed = false;

function optionMarker(o, show){
  return (show && o.c) ? "✓" : "";
}

function renderList(){
  const list = document.getElementById('qlist');
  list.innerHTML = '';
  DATA.forEach((q, i) => {
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.className = 'qbtn' + (i===current ? ' active' : '');
    btn.onclick = () => { current = i; revealed = false; render(); document.getElementById('sidebar').classList.remove('open'); window.scrollTo({top:0,behavior:'smooth'}); };
    btn.innerHTML = `<span class="num">Q${q.num}</span><span class="meta"><span class="topic">${q.topic}</span><span class="type">${q.type} · ${q.marks} marks</span></span>`;
    li.appendChild(btn);
    list.appendChild(li);
  });
}

function render(){
  const q = DATA[current];
  const el = document.getElementById('content');

  let optsHtml = q.options.map(o => `
    <li class="opt ${revealed && o.c ? 'correct':''}">
      <span class="mark">${optionMarker(o, revealed)}</span>
      <span>${o.t}</span>
    </li>`).join('');

  let whyHtml = q.why.map(w => `
    <div class="why-item ${w.good ? 'good':'bad'}">
      <span class="dot"></span>
      <span>${w.t}</span>
    </div>`).join('');

  el.innerHTML = `
    <div class="nav nav-top">
      <button class="navbtn" id="prevBtn">&larr; Previous</button>
      <button class="navbtn" id="nextBtn">Next &rarr;</button>
    </div>

    <div class="top-tags">
      <span class="tag strong">Question ${q.num}</span>
      <span class="tag">${q.type}</span>
      <span class="tag">${q.marks} marks</span>
    </div>
    <h2 class="qtitle">${q.topic}</h2>
    <div class="prompt">${q.question}</div>
    ${q.yaml ? `<div class="yaml">${q.yaml.replace(/</g,'&lt;')}</div>` : ''}
    <ul class="options">${optsHtml}</ul>

    ${revealed ? `
    <div class="panel simple">
      <h3>In plain terms</h3>
      <p>${q.simple}</p>
    </div>

    <div class="panel why">
      <h3>Why each option is right or wrong</h3>
      ${whyHtml}
    </div>
    ` : `
    <button class="navbtn reveal" id="revealBtn">Show answer &amp; explanation</button>
    `}
  `;

  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === DATA.length - 1;
  document.getElementById('prevBtn').onclick = () => { if(current>0){current--; revealed=false; render(); window.scrollTo({top:0,behavior:'smooth'});} };
  document.getElementById('nextBtn').onclick = () => { if(current<DATA.length-1){current++; revealed=false; render(); window.scrollTo({top:0,behavior:'smooth'});} };

  const rb = document.getElementById('revealBtn');
  if(rb){ rb.onclick = () => { revealed = true; render(); }; }

  renderList();
}

render();
</script>
</body>
</html>
